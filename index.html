<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flowy.ai</title>
<style>
/* ==========================================================
   FLOWY · base.css
   Tokens (Figma "Flowy · Blanco") + reset + componentes comunes
   ========================================================== */
@import url("https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Inter:wght@400;500;600&family=Unbounded:wght@400;500;600&display=swap");

:root {
  /* Colores (variables de Figma) */
  --accent-neon: #8b4dff;
  --accent-mauve: #6a3fd0;
  --text-primary: #1a0f2e;
  --text-secondary: #4e3f6e;
  --text-muted: #7d6fa0;
  --bg-void: #ffffff;
  --bg-panel: #ffffff;
  --bg-surface: #f3ecff;
  --bg-deep: #f7f2ff;

  /* Derivados */
  --line: rgba(139, 77, 255, 0.55);
  --line-soft: rgba(139, 77, 255, 0.18);
  --grad-btn: linear-gradient(185.8deg, #a970ff 13.4%, #d26bff 86.6%);
  --grad-text: linear-gradient(90deg, #a970ff 0%, #d26bff 100%);
  --glow: 0 8px 24px rgba(169, 112, 255, 0.35);
  --shadow-card: 0 1px 1px rgba(169, 112, 255, 0.15), 0 8px 24px rgba(139, 77, 255, 0.06);
  --ok: #19b37d;

  /* Tipografía */
  --font-display: "Unbounded", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, sans-serif;
  --font-label: "Geist", "Inter", system-ui, sans-serif;

  --radius-pill: 9999px;
  --radius-lg: 16px;
  --radius-md: 12px;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 22px;
  color: var(--text-primary);
  background: var(--bg-void);
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
:focus-visible { outline: 2px solid var(--accent-neon); outline-offset: 2px; }

/* ---------- Iconos (inyectados por js/icons.js) ---------- */
.i { display: inline-flex; width: 18px; height: 18px; flex: none; }
.i svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.i--sm { width: 14px; height: 14px; }
.i--lg { width: 22px; height: 22px; }

/* ---------- Tipografía ---------- */
.display { font-family: var(--font-display); font-weight: 500; letter-spacing: -0.04em; line-height: 1.15; }
.eyebrow {
  font-family: var(--font-label); font-weight: 500; font-size: 11px; line-height: 16px;
  letter-spacing: .6px; text-transform: uppercase; color: var(--accent-neon);
}
.label { font-family: var(--font-label); font-weight: 500; font-size: 12px; line-height: 16px; }
.upper { text-transform: uppercase; letter-spacing: .6px; font-size: 11px; font-family: var(--font-label); font-weight: 500; }
.muted { color: var(--text-muted); }
.text-2 { color: var(--text-secondary); }
.grad-text { background: var(--grad-text); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 48px; padding: 0 28px; border-radius: var(--radius-pill);
  font-family: var(--font-label); font-weight: 500; font-size: 14px; line-height: 20px;
  transition: transform .15s ease, box-shadow .2s ease, background .2s ease, opacity .2s;
  white-space: nowrap;
}
.btn--primary { background: var(--grad-btn); color: #fff; box-shadow: var(--glow); }
.btn--primary:hover { transform: translateY(-1px); box-shadow: 0 12px 30px rgba(169, 112, 255, .5); }
.btn--primary:active { transform: translateY(0); }
.btn--secondary { background: var(--bg-surface); color: var(--text-primary); border: 1px solid var(--line-soft); }
.btn--secondary:hover { background: #ebdfff; border-color: var(--line); }
.btn--outline { background: #fff; border: 1px solid var(--line); color: var(--text-primary); }
.btn--outline:hover { background: var(--bg-deep); }
.btn--sm { height: 36px; padding: 0 16px; font-size: 13px; }
.btn--block { width: 100%; }
.btn[disabled] { opacity: .6; pointer-events: none; }

/* ---------- Pills / chips ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 14px;
  border-radius: var(--radius-pill); background: var(--bg-surface);
  font-family: var(--font-label); font-weight: 500; font-size: 12px; color: var(--text-primary);
  white-space: nowrap;
}
.pill--white { background: #fff; box-shadow: 0 1px 2px rgba(139,77,255,.12); }
.pill--outline { background: #fff; border: 1px solid var(--line); }
.pill--sm { height: 22px; padding: 0 10px; font-size: 11px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-neon); flex: none; }
.dot--ok { background: var(--ok); }
.dot--muted { background: var(--text-muted); }

.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 16px;
  border-radius: var(--radius-pill); background: var(--bg-surface);
  font-family: var(--font-label); font-weight: 500; font-size: 12px; color: var(--text-secondary);
  transition: background .15s, color .15s, box-shadow .15s;
}
.chip:hover { background: #e8dbff; }
.chip.is-selected { background: var(--grad-btn); color: #fff; box-shadow: 0 4px 14px rgba(169,112,255,.35); }
.chip.is-selected::before { content: "✓"; font-size: 11px; }
.chip--plain.is-selected::before { content: none; }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- Cards ---------- */
.card { background: var(--bg-panel); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 24px; }
.card--line { border: 1px solid var(--line); box-shadow: none; }
.card h3, .card-title { font-family: var(--font-body); font-weight: 500; font-size: 18px; line-height: 26px; letter-spacing: -0.18px; }
.card-sub { font-size: 12px; line-height: 16px; color: var(--text-muted); }

.progress { height: 6px; border-radius: var(--radius-pill); background: var(--bg-surface); overflow: hidden; }
.progress > span { display: block; height: 100%; border-radius: inherit; background: var(--grad-btn); }

/* ---------- Formularios ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--text-primary); }
.input {
  display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 18px;
  border-radius: var(--radius-pill); background: var(--bg-surface); border: 1px solid transparent;
  color: var(--text-muted); transition: border-color .15s, background .15s, box-shadow .15s;
}
.input:focus-within { border-color: var(--accent-neon); background: #fff; box-shadow: 0 0 0 4px rgba(139,77,255,.12); }
.input input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 14px; color: var(--text-primary); }
.input input::placeholder { color: var(--text-muted); }
.input--outline { background: #fff; border-color: var(--line); }
.input .toggle-pass { color: var(--text-muted); display: inline-flex; }
.input .toggle-pass:hover { color: var(--accent-neon); }

.check { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); cursor: pointer; }
.check input { appearance: none; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--accent-neon); display: grid; place-content: center; margin: 0; background: #fff; }
.check input[type="checkbox"].sq { border-radius: 5px; }
.check input:checked { background: var(--accent-neon); }
.check input:checked::after { content: ""; width: 4px; height: 8px; border: solid #fff; border-width: 0 1.6px 1.6px 0; transform: rotate(45deg) translate(-1px, -1px); }
.check a { text-decoration: underline; color: var(--text-primary); }

/* Toggle switch */
.switch { position: relative; width: 44px; height: 24px; flex: none; }
.switch input { appearance: none; position: absolute; inset: 0; margin: 0; cursor: pointer; border-radius: var(--radius-pill); background: #e3d6fb; transition: background .2s; }
.switch input:checked { background: var(--grad-btn); }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(26,15,46,.25); transition: transform .2s; pointer-events: none; }
.switch:has(input:checked)::after { transform: translateX(20px); }

/* Logo */
.logo { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-body); font-weight: 500; font-size: 18px; letter-spacing: -0.4px; }
.logo b { font-weight: 500; }
.logo .logo-mark { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-neon); color: #fff; display: grid; place-content: center; font-weight: 600; font-size: 14px; }
.logo .logo-mark--sq { border-radius: 8px; background: linear-gradient(135deg, #8b4dff, #d26bff); }
.logo small { font-weight: 400; color: var(--text-secondary); font-size: inherit; }

/* Utilidades */
.hide { display: none !important; }
.row { display: flex; align-items: center; gap: 12px; }
.spacer { flex: 1; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.fade-up { animation: fadeUp .5s ease both; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* ==========================================================
   FLOWY · auth.css  — Login, Registro y Onboarding (split layout)
   ========================================================== */
.auth { display: grid; grid-template-columns: var(--left, 1fr) 1fr; min-height: 100vh; }
.auth--onb1 { --left: 1.4fr; }

/* ----- Panel izquierdo ----- */
.auth-visual {
  position: relative; overflow: hidden; background-color: var(--bg-deep);
  background-image:
    linear-gradient(rgba(139,77,255,.09) 1px, transparent 1px),
    linear-gradient(90deg, rgba(139,77,255,.09) 1px, transparent 1px);
  background-size: 32px 32px;
  display: flex; flex-direction: column; padding: 40px; gap: 24px;
}
.auth-visual::before { /* resplandor inferior */
  content: ""; position: absolute; left: 50%; bottom: -120px; width: 520px; height: 360px; transform: translateX(-50%);
  background: radial-gradient(closest-side, rgba(169,112,255,.22), transparent); pointer-events: none;
}
.auth-visual > * { position: relative; }
.badges { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.badges .pill { height: 28px; background: #fff; letter-spacing: .5px; font-size: 11px; text-transform: uppercase; padding: 0 20px; box-shadow: 0 1px 3px rgba(139,77,255,.1); }
.badges .pill--plain { background: transparent; box-shadow: none; text-transform: none; color: var(--text-secondary); padding: 0; font-weight: 400; }
.badges .pill--case { text-transform: none; }

.stage { flex: 1; display: grid; place-items: center; min-height: 340px; }
.orbit { position: relative; width: 380px; height: 380px; display: grid; place-items: center; }
.orbit::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1px dashed rgba(139,77,255,.45); }
.orbit::after { content: ""; position: absolute; inset: 38px; border-radius: 50%; border: 1px solid rgba(139,77,255,.4); box-shadow: 0 0 40px rgba(169,112,255,.12) inset; }
.orbit-disc {
  position: relative; width: 220px; height: 220px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 35%, #e9d9ff 0%, #c9a6ff 55%, #a970ff 100%);
  border: 2px solid rgba(139,77,255,.75);
  box-shadow: 0 0 0 6px rgba(169,112,255,.15), 0 0 60px rgba(169,112,255,.55);
}
.orbit-disc .flowy3d { --w: 170px; margin-top: -6px; }

.auth-copy { display: flex; flex-direction: column; gap: 14px; }
.auth-copy .pill { align-self: flex-start; height: 28px; background: transparent; border: 1px solid var(--line); text-transform: uppercase; letter-spacing: .6px; font-size: 11px; padding: 0 18px; font-weight: 400; }
.auth-copy h2 { font-family: var(--font-display); font-weight: 500; font-size: 38px; line-height: 1.14; letter-spacing: -0.045em; max-width: 520px; }
.auth-copy .metrics { display: flex; gap: 32px; margin-top: 8px; }
.auth-copy .metric b { display: block; font-family: var(--font-display); font-weight: 500; font-size: 28px; letter-spacing: -.04em; }
.auth-copy .metric span { font-size: 12px; color: var(--text-secondary); }

/* ----- Panel derecho ----- */
.auth-form { display: flex; flex-direction: column; padding: 40px 48px 28px; min-height: 100vh; background: #fff; }
.auth-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.auth-top .pill { font-weight: 400; color: var(--text-secondary); }
.auth-main { flex: 1; display: flex; flex-direction: column; justify-content: center; width: 100%; max-width: 450px; margin: 0 auto; padding: 28px 0; gap: 20px; }
.auth-main h1 { font-family: var(--font-display); font-weight: 500; font-size: 38px; line-height: 1.12; letter-spacing: -0.05em; }
.auth-main h1.sm { font-size: 28px; }
.auth-main .lead { color: var(--text-secondary); font-size: 14px; line-height: 21px; }
.social { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.social button { height: 44px; border-radius: var(--radius-pill); border: 1px solid var(--line); background: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--font-label); font-weight: 500; font-size: 13px; transition: background .15s; }
.social button:hover { background: var(--bg-deep); }
.divider { display: flex; align-items: center; gap: 16px; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-secondary); }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }
.form { display: flex; flex-direction: column; gap: 14px; }
.form-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
.form-meta a { font-weight: 500; color: var(--text-primary); }
.switch-auth { text-align: center; font-size: 14px; color: var(--text-secondary); }
.switch-auth a { font-weight: 600; color: var(--text-primary); text-decoration: underline; text-underline-offset: 3px; }
.auth-foot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); max-width: 450px; width: 100%; margin: 0 auto; padding-top: 16px; }
.auth-foot nav { display: flex; gap: 10px; }
.auth-foot a:hover { color: var(--accent-neon); }

/* ----- Onboarding ----- */
.onb-title { font-family: var(--font-display); font-weight: 500; font-size: 30px; line-height: 1.15; letter-spacing: -0.05em; }
.q-label { font-size: 13px; font-weight: 500; color: var(--text-primary); margin-bottom: 10px; display: block; }
.q-label.upper { color: var(--text-secondary); }

.opt-list { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 14px; text-align: left; width: 100%;
  background: var(--bg-surface); border-radius: 28px; padding: 14px 20px; border: 1px solid transparent;
  transition: border-color .15s, background .15s, transform .15s;
}
.opt:hover { background: #ebdfff; }
.opt .i { color: var(--text-secondary); }
.opt b { display: block; font-weight: 500; font-size: 14px; line-height: 18px; }
.opt small { display: block; color: var(--text-secondary); font-size: 12px; line-height: 16px; }
.opt .tick { margin-left: auto; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-neon); color: #fff; display: none; place-items: center; }
.opt .tick .i { width: 12px; height: 12px; color: #fff; }
.opt.is-selected { border-color: var(--accent-neon); background: #efe3ff; }
.opt.is-selected .tick { display: grid; }

.cards2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card-opt {
  position: relative; text-align: left; background: var(--bg-surface); border-radius: 4px; padding: 14px; min-height: 124px;
  display: flex; flex-direction: column; justify-content: space-between; border: 1px solid transparent; transition: border-color .15s, background .15s;
}
.card-opt:hover { background: #ebdfff; }
.card-opt .emo { font-size: 20px; line-height: 28px; font-family: var(--font-label); }
.card-opt b { display: block; font-family: var(--font-label); font-weight: 500; font-size: 14px; line-height: 20px; letter-spacing: -.07px; }
.card-opt small { display: block; font-size: 13px; line-height: 18px; color: var(--text-secondary); margin-top: 3px; }
.card-opt .tick { position: absolute; top: 14px; right: 14px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent-neon); color: #fff; display: none; place-items: center; }
.card-opt .tick .i { width: 9px; height: 9px; }
.card-opt.is-selected { border-color: rgba(139,77,255,.35); }
.card-opt.is-selected .tick { display: grid; }

.onb-actions { display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
.onb-actions .links { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); }
.onb-actions .links a { display: inline-flex; align-items: center; gap: 6px; }
.onb-actions .links a:hover { color: var(--accent-neon); }
.onb-actions .links.center { justify-content: center; }

.plain-input { height: 48px; border-radius: 24px; background: var(--bg-surface); border: 1px solid transparent; padding: 0 20px; width: 100%; outline: 0; font-size: 14px; }
.plain-input:focus { border-color: var(--accent-neon); background: #fff; box-shadow: 0 0 0 4px rgba(139,77,255,.12); }

/* Resumen onboarding 3 */
.summary { background: var(--bg-surface); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.summary-head { display: flex; justify-content: space-between; align-items: center; }
.summary-head .pill { background: #fff; }
.summary dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 12px 16px; font-size: 12px; }
.summary dt { color: var(--text-secondary); }
.summary dd { margin: 0; text-align: right; font-weight: 500; }
.summary .preset { background: #fff; border-radius: 12px; padding: 8px 12px; font-size: 11px; display: flex; align-items: center; gap: 8px; }
.choice-card {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 18px; border-radius: 24px;
  background: var(--bg-surface); border: 1px solid transparent; transition: all .15s;
}
.choice-card .ico { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: transparent; color: var(--text-muted); flex: none; }
.choice-card b { display: block; font-size: 15px; line-height: 20px; font-weight: 500; }
.choice-card small { display: block; font-size: 12px; color: var(--text-secondary); }
.choice-card .radio { margin-left: auto; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line-soft); display: grid; place-items: center; flex: none; }
.choice-card.is-selected { background: #fff; border-color: var(--line-soft); box-shadow: 0 10px 28px rgba(139,77,255,.14); }
.choice-card.is-selected .ico { background: var(--accent-neon); color: #fff; }
.choice-card.is-selected .radio { background: var(--accent-neon); border-color: var(--accent-neon); }
.choice-card.is-selected .radio::after { content: ""; width: 6px; height: 6px; background: #fff; border-radius: 50%; }

@media (max-width: 980px) {
  .auth { grid-template-columns: 1fr; }
  .auth-visual { display: none; }
  .auth-form { padding: 24px 20px; }
}

/* Pantallas bajas: compactar el panel visual para que no se corten las métricas */
@media (max-height: 900px) {
  .stage { min-height: 280px; }
  .orbit { width: 320px; height: 320px; }
  .orbit-disc { width: 190px; height: 190px; }
  .auth-copy h2 { font-size: 32px; }
  .auth-visual { padding: 32px 40px; gap: 16px; }
}
@media (max-height: 900px) {
  .stage { min-height: 230px; }
  .orbit { width: 290px; height: 290px; }
  .orbit-disc { width: 175px; height: 175px; }
  .auth-copy h2 { font-size: 28px; }
  .auth-copy .metric b { font-size: 22px; }
}

/* ==========================================================
   FLOWY · app.css — Shell (header + sidebar) y pantallas internas
   ========================================================== */

/* ---------- Shell ---------- */
.app-header {
  position: fixed; inset: 0 0 auto 0; height: 64px; z-index: 20;
  display: flex; align-items: center; justify-content: flex-end; gap: 16px; padding: 0 40px;
  background: rgba(255,255,255,.86); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(139,77,255,.08);
}
.app-header .logo { font-weight: 500; font-size: 20px; margin-right: 12px; letter-spacing: -.5px; }
.studio-pill, .credit-pill {
  display: inline-flex; align-items: center; gap: 10px; border-radius: var(--radius-pill); background: var(--bg-surface);
  font-family: var(--font-label); font-weight: 500; font-size: 12px; line-height: 16px; padding: 0 14px; height: 40px;
}
.studio-pill { width: 156px; text-align: left; justify-content: space-between; }
.studio-pill span { flex: 1; }
.credit-pill { height: 44px; padding: 0 20px; width: 152px; }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: var(--text-primary); }
.icon-btn:hover { background: var(--bg-surface); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--grad-btn); color: #fff; display: grid; place-items: center; box-shadow: var(--glow); }

.app-sidebar {
  position: fixed; top: 64px; bottom: 0; left: 0; width: 256px; z-index: 10;
  display: flex; flex-direction: column; padding: 16px 12px 24px; background: #fff;
}
.side-label { font-family: var(--font-label); font-size: 12px; letter-spacing: .6px; text-transform: uppercase; color: var(--text-secondary); padding: 8px 12px 12px; }
.side-nav { display: flex; flex-direction: column; gap: 4px; }
.side-nav a {
  display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 16px; border-radius: var(--radius-pill);
  font-size: 14px; font-weight: 400; color: var(--text-primary); transition: background .15s;
}

/* ---------- Dashboard ---------- */

.quick { padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 12px; }

.dash-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; align-items: start; }

.script-item .actions { display: flex; align-items: center; gap: 6px; }
.batch { display: flex; align-items: center; gap: 20px; padding: 22px 24px; border-radius: 16px; background: linear-gradient(120deg, #f3ecff, #ead9ff); }

.tpl-list { display: flex; flex-direction: column; gap: 14px; }

/* ---------- Generador ---------- */
.gen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }

.beats { display: flex; flex-direction: column; gap: 12px; }

.beat.is-new { animation: fadeUp .45s ease both; }
.beat-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-secondary); font-family: var(--font-label); }
.beat p { font-size: 15px; line-height: 22px; }
.beat em { font-style: normal; font-size: 12px; color: var(--text-muted); }
.stats4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; text-align: left; background: #fff; }
.stat b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 30px; color: var(--accent-neon); letter-spacing: -.04em; }
.stat span { font-size: 11px; letter-spacing: .6px; text-transform: uppercase; color: var(--text-secondary); font-family: var(--font-label); }
.panel-foot { display: flex; gap: 10px; }
.panel-foot .btn { flex: 1; }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); border-top-color: #fff; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: fixed; left: 50%; bottom: 32px; transform: translate(-50%, 20px); background: var(--text-primary); color: #fff; padding: 10px 18px; border-radius: var(--radius-pill); font-size: 13px; opacity: 0; transition: all .25s; z-index: 50; pointer-events: none; }
.toast.is-show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Biblioteca ---------- */
.toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.search { display: flex; align-items: center; gap: 10px; height: 38px; width: 240px; border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 0 16px; color: var(--text-muted); background: #fff; }
.search input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; font-size: 12px; color: var(--text-primary); }
.lib-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.lib-card { border: 1px solid var(--line); border-radius: 16px; background: #fff; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 12px; transition: transform .15s, box-shadow .2s; }
.lib-card:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(139,77,255,.15); }
.lib-card .top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-family: var(--font-label); }
.lib-card .top .pill { height: 30px; font-weight: 500; }
.lib-card .state { display: inline-flex; align-items: center; gap: 6px; }

.lib-card .meta { font-size: 11px; color: var(--text-secondary); }

.lib-card .foot .score { color: var(--accent-neon); }
.empty { grid-column: 1 / -1; text-align: center; padding: 48px 0; color: var(--text-muted); }

/* ---------- Analíticas ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.kpi { border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; background: #fff; }
.kpi span { font-size: 13px; color: var(--text-secondary); }
.kpi b { font-family: var(--font-display); font-weight: 500; font-size: 32px; line-height: 38px; letter-spacing: -.05em; }
.kpi em { font-style: normal; font-size: 11px; color: var(--accent-neon); font-family: var(--font-label); font-weight: 500; }
.an-grid { display: grid; grid-template-columns: 1.9fr 1fr; gap: 20px; align-items: stretch; }
.an-grid.alt { grid-template-columns: 1.9fr 1fr; }
.chart-wrap { position: relative; }
.chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
.axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); font-family: var(--font-label); padding-top: 8px; }
.bars { display: flex; flex-direction: column; gap: 14px; }
.bar-row .top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; }
.bar-row .top b { font-weight: 500; color: var(--accent-neon); }
.heat { display: grid; grid-template-columns: 36px repeat(6, 1fr); gap: 6px; align-items: center; font-size: 11px; color: var(--text-secondary); font-family: var(--font-label); }
.heat .cell { height: 22px; border-radius: 6px; background: rgba(139,77,255, var(--a, .1)); transition: transform .15s; }

.heat .hd { text-align: center; }
.plat-list { display: flex; flex-direction: column; gap: 14px; }
.plat-row { display: flex; align-items: center; gap: 12px; font-size: 13px; }
.plat-row .name { width: 120px; }
.plat-row .progress { flex: 1; }
.plat-row .v { width: 90px; text-align: right; color: var(--text-secondary); font-size: 12px; }

/* ---------- Configuración ---------- */
.conf-grid { display: grid; grid-template-columns: 1.9fr 1fr; gap: 20px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 20px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
.form-grid .full { grid-column: 1 / -1; }
.text-input { height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-surface); padding: 0 14px; font-size: 13px; outline: 0; width: 100%; }
.text-input:focus { background: #fff; box-shadow: 0 0 0 4px rgba(139,77,255,.12); }
.tone-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tone { border: 1px solid var(--line); border-radius: 8px; background: var(--bg-surface); padding: 14px; text-align: left; position: relative; transition: all .15s; }
.tone b { display: block; font-size: 13px; font-weight: 500; }
.tone small { display: block; font-size: 11px; color: var(--text-secondary); margin-top: 6px; line-height: 15px; }
.tone .ck { position: absolute; top: 12px; right: 12px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent-neon); color: #fff; display: none; place-items: center; font-size: 11px; }
.tone.is-selected { background: linear-gradient(135deg, #e8d8ff, #f3ecff); box-shadow: 0 8px 22px rgba(139,77,255,.22); }
.tone.is-selected .ck { display: grid; }
.pref { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid var(--line-soft); }
.pref:first-of-type { border-top: 0; }
.pref b { display: block; font-size: 14px; font-weight: 500; }
.pref small { font-size: 12px; color: var(--text-secondary); }
.plan-card { border: 1px solid var(--line); border-radius: 16px; padding: 20px; background: linear-gradient(160deg, #fff, #f3ecff); box-shadow: 0 10px 30px rgba(139,77,255,.14); display: flex; flex-direction: column; gap: 12px; }
.plan-card h3 { font-family: var(--font-display); font-weight: 500; font-size: 22px; letter-spacing: -.04em; }
.plan-card .big { font-family: var(--font-display); font-size: 28px; color: #a970ff; letter-spacing: -.04em; }
.plan-card .big small { font-family: var(--font-body); font-size: 13px; color: var(--text-secondary); letter-spacing: 0; margin-left: 6px; }
.integ { display: flex; flex-direction: column; gap: 14px; }
.integ-row { display: flex; align-items: center; gap: 12px; font-size: 14px; }
.integ-row .lt { width: 26px; height: 26px; border-radius: 8px; background: var(--bg-surface); border: 1px solid var(--line); display: grid; place-items: center; font-size: 11px; font-family: var(--font-label); font-weight: 500; }
.integ-row .name { flex: 1; }
.integ-row button { height: 26px; padding: 0 12px; border-radius: var(--radius-pill); font-family: var(--font-label); font-size: 11px; font-weight: 500; background: #f1f1f5; color: var(--text-primary); transition: all .15s; }
.integ-row button.on { background: var(--bg-surface); color: var(--accent-mauve); }

@media (max-width: 1180px) {
  .metrics, .kpis { grid-template-columns: repeat(2, 1fr); }
  .dash-grid, .gen-grid, .an-grid, .conf-grid { grid-template-columns: 1fr; }
  .lib-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 860px) {
  .app-sidebar { display: none; }
  .main { margin-left: 0; padding: 20px; }
  .app-header { padding: 0 16px; }
  .studio-pill, .credit-pill { display: none; }
  .lib-grid { grid-template-columns: 1fr; }
  .hello { grid-template-columns: 1fr; }

}

.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; }

/* ==========================================================
   FLOWY · flowy3d.css — mascota 3D interactiva (ver js/flowy3d.js)
   ========================================================== */
.flowy3d { position: relative; display: block; width: var(--w, 170px); flex: none; perspective: 900px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.flowy3d > img { width: 100%; height: auto; display: block; }              /* respaldo sin JS */
.flowy3d.is-3d { max-width: none; }
.f3d-float { position: absolute; inset: 0; transform-style: preserve-3d; animation: f3d-breathe 5s ease-in-out infinite; }
.f3d-tilt { position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform; transform-origin: 50% 55%; }
.f3d-body { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity .35s; }
.is-ready .f3d-body { opacity: 1; }
.f3d-face { position: absolute; inset: 0; transform-style: preserve-3d; pointer-events: none; }
.f3d-shadow {
  position: absolute; left: 14%; right: 14%; bottom: -5%; height: 9%; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(70, 20, 140, .38), rgba(70, 20, 140, 0)); filter: blur(5px);
  animation: f3d-shadow 5s ease-in-out infinite; transform-origin: center;
}

/* ----- Ojos (cuentas brillantes) ----- */
.f3d-eye {
  position: absolute; border-radius: 50%; opacity: 0; transition: opacity .35s;
  background: radial-gradient(circle at 36% 32%, #5d4a80 0, #26173a 16%, #0b0513 58%, #030106 100%);
  box-shadow: 0 0 0 .09em rgba(52, 16, 98, .34), 0 .12em .22em rgba(38, 8, 78, .5), inset -.1em -.14em .22em rgba(142, 96, 232, .3);
  will-change: transform;
}
.is-ready .f3d-eye { opacity: 1; }
.f3d-eye::before {   /* brillo grande de ventana */
  content: ""; position: absolute; left: 16%; top: 11%; width: 40%; height: 30%; border-radius: 50%;
  background: radial-gradient(ellipse at 40% 40%, rgba(255, 255, 255, .98), rgba(255, 255, 255, .55) 55%, rgba(255, 255, 255, 0) 100%);
  transform: translate(var(--hx, 0), var(--hy, 0)) rotate(-24deg); filter: blur(.2px);
}
.f3d-eye::after {    /* brillo pequeño de rebote */
  content: ""; position: absolute; right: 17%; bottom: 14%; width: 15%; height: 15%; border-radius: 50%;
  background: rgba(255, 255, 255, .6); transform: translate(var(--hx, 0), var(--hy, 0)); filter: blur(.4px);
}

/* ----- Ojos con esclerótica (pose "pensando") ----- */
.f3d-eye.sclera {
  overflow: hidden; background: radial-gradient(ellipse at 50% 62%, #ffffff 0 52%, #eee6f8 82%, #d9c9ef 100%);
  box-shadow: 0 0 0 .08em rgba(80, 40, 140, .25), 0 .1em .2em rgba(60, 20, 110, .35), inset 0 .35em .5em rgba(86, 44, 150, .42);
}
.f3d-eye.sclera::before, .f3d-eye.sclera::after { content: none; }
.f3d-pupil {
  position: absolute; left: 50%; top: 50%; border-radius: 50%; will-change: transform;
  background: radial-gradient(circle at 36% 32%, #5d4a80 0, #26173a 16%, #0b0513 58%, #030106 100%);
}
.f3d-pupil::before { content: ""; position: absolute; left: 18%; top: 12%; width: 38%; height: 30%; border-radius: 50%; background: rgba(255, 255, 255, .95); transform: translate(var(--hx, 0), var(--hy, 0)) rotate(-24deg); }
.f3d-pupil::after { content: ""; position: absolute; right: 18%; bottom: 14%; width: 15%; height: 15%; border-radius: 50%; background: rgba(255, 255, 255, .55); }
.f3d-lid { position: absolute; inset: -2px; background: linear-gradient(#ad8ce3, #9a75d6); box-shadow: inset 0 -.14em 0 rgba(36, 10, 70, .6); transform-origin: top; transform: scaleY(0); z-index: 2; }

/* ----- Movimiento ----- */
@keyframes f3d-breathe { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-2.2%) scale(1.008, 1.012); } }
@keyframes f3d-shadow { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .72; transform: scale(.92); } }
.f3d-float.jump { animation: f3d-jump 1.1s cubic-bezier(.3, .7, .4, 1) 1, f3d-breathe 5s ease-in-out 1.1s infinite; }
@keyframes f3d-jump {
  0% { transform: translateY(0) scale(1, 1); } 16% { transform: translateY(2%) scale(1.07, .91); }
  42% { transform: translateY(-14%) scale(.96, 1.06); } 68% { transform: translateY(0) scale(1.06, .93); }
  84% { transform: translateY(-3%) scale(1, 1); } 100% { transform: translateY(0) scale(1, 1); }
}

/* ----- Paralaje del escenario (anillos que reaccionan a la mirada) ----- */
.orbit::before { transform: translate(calc(var(--gx, 0) * -10px), calc(var(--gy, 0) * -8px)); transition: transform .15s linear; }
.orbit::after { transform: translate(calc(var(--gx, 0) * -5px), calc(var(--gy, 0) * -4px)); transition: transform .15s linear; }
.orbit-disc { transform: translate(calc(var(--gx, 0) * 4px), calc(var(--gy, 0) * 3px)); transition: transform .15s linear; }

@media (prefers-reduced-motion: reduce) {
  .f3d-float, .f3d-shadow, .f3d-float.jump { animation: none !important; }
}

.stage-3d::before { transform: translate(calc(var(--gx, 0) * -10px), calc(var(--gy, 0) * -8px)); transition: transform .15s linear; }

</style>

      if (host) { host.style.setProperty("--gx", this.h.x.toFixed(3)); host.style.setProperty("--gy", this.h.y.toFixed(3)); }
      this.paint(this.h.x, this.h.y, false);
    }
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - prev) / 1000 || 0.016); prev = now;
    for (let i = inst.length - 1; i >= 0; i--) { if (!inst[i].root.isConnected) { inst[i].io.disconnect(); inst[i].ro.disconnect(); inst.splice(i, 1); } }
    let any = false;
    for (const f of inst) if (f.visible && f.ready) { f.update(now, dt); any = true; }
    if (any && !document.hidden) requestAnimationFrame(frame); else running = false;
  }
  function start() { if (!running) { running = true; prev = performance.now(); requestAnimationFrame(frame); } }

  function mount(root) {
    if (root.__f3d) return root.__f3d;
    const f = new Flowy(root); if (!f.meta) return null;
    root.__f3d = f; inst.push(f); start(); return f;
  }
  function mountAll(scope) { (scope || document).querySelectorAll(".flowy3d").forEach(mount); }

  document.addEventListener("visibilitychange", () => { if (!document.hidden) start(); });
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", () => mountAll()); else mountAll();
  window.Flowy3D = { mount, mountAll };
})();

(function () {

  function toast(msg, ms = 2200) {
    if (!toastEl) { toastEl = document.createElement("div"); toastEl.className = "toast"; document.body.appendChild(toastEl); }
    toastEl.textContent = msg;
    toastEl.classList.add("is-show");

  function copiar(text) {
    const done = () => toast("Guion copiado al portapapeles");

  async function pedirGuion(datos) {
    const sinServidor = "Para usar la IA abre la web con «npm start» (http://localhost:3000)";
    if (location.protocol === "file:") throw new Error(sinServidor);
    let r;
    try {
      r = await fetch("/api/guion", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(datos) });
    } catch (e) { throw new Error("No hay conexión con el servidor de Flowy"); }
    if (r.status === 404 || r.status === 405) throw new Error(sinServidor);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "No pudimos generar el guion. Inténtalo de nuevo.");
    return j;
  }

  function resaltar(texto, clave) {
    const t = esc(texto), k = esc(clave).trim(), i = k ? t.toLowerCase().indexOf(k.toLowerCase()) : -1;
    return i < 0 ? t : t.slice(0, i) + "<b>" + t.slice(i, i + k.length) + "</b>" + t.slice(i + k.length);
  }
  const notaBloque = (b) => [b.texto_pantalla && "En pantalla: " + b.texto_pantalla, b.pista].filter(Boolean).map(esc).join(" · ");
  const revisionTxt = (g) => g.revision.filter((r) => r.ok).length + "/" + g.revision.length;
  function htmlExtra(g) {
    const notas = g.revision.filter((r) => !r.ok && r.nota).map((r) => esc(r.nota)).join(" ");
    return `<div class="checks">${g.revision.map((r) => `<span class="check${r.ok ? "" : " no"}">${r.ok ? "✓" : "✗"} ${esc(r.texto)}</span>`).join("")}</div>` +
      (notas ? `<p class="nota">${notas}</p>` : "") +
      (g.ganchos.length ? `<details><summary>Otros ${g.ganchos.length} ganchos para probar</summary><ol>${g.ganchos.map((x) => `<li>${esc(x)}</li>`).join("")}</ol></details>` : "") +
      (g.leyenda ? `<details><summary>Leyenda lista para publicar</summary><p>${esc(g.leyenda)}</p></details>` : "");

  function curvePath(vals, w, h, pad) {
    const step = w / (vals.length - 1);
    const y = (v) => pad + (h - pad * 2) * (1 - (v - 20) / 80);
    let d = "";
    vals.forEach((v, i) => {
      const x = i * step, yy = y(v);
      if (i === 0) d += `M${x},${yy}`;
      else { const px = (i - 1) * step, py = y(vals[i - 1]); const cx = (px + x) / 2; d += ` C${cx},${py} ${cx},${yy} ${x},${yy}`; }
    });
    return { line: d, area: d + ` L${w},${h} L0,${h} Z`, last: [w, y(vals[vals.length - 1])] };
  }
  function initAnalytics() {
    const W = 640, H = 220;
    const draw = (key) => {
      const P = PERIODS[key];
      [["views", "#k-views"], ["ret", "#k-ret"], ["pub", "#k-pub"], ["viral", "#k-viral"]].forEach(([k, sel]) => {
        $(sel + " b").textContent = P[k][0]; $(sel + " em").textContent = P[k][1];
      });
      $("#bench").textContent = "Benchmark nicho: " + P.bench;
      const c = curvePath(P.curve, W, H, 14);
      const bench = curvePath(P.curve.map((v, i) => 100 - 78 * (1 - Math.exp(-i / 3.4))), W, H, 14);
      $("#ret-line").setAttribute("d", c.line);
      $("#ret-area").setAttribute("d", c.area);
      $("#ret-bench").setAttribute("d", bench.line);
      $("#ret-dot").setAttribute("cx", c.last[0]); $("#ret-dot").setAttribute("cy", c.last[1]);
      $("#hooks").innerHTML = HOOK_NAMES.map((n, i) => `
        <div class="bar-row"><div class="top"><span>${n}</span><b>${P.hooks[i]}%</b></div><div class="progress"><span style="width:${P.hooks[i]}%"></span></div></div>`).join("");
    };
    $('[data-group="periodo"]').addEventListener("flowy:change", (e) => draw(e.detail.value));
    draw("30 días");

    // Mapa de calor (valores 0–1) — pico: jueves 20 h
    const days = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
    const data = [[.12, .25, .3, .42, .6, .3], [.15, .3, .35, .5, .66, .34], [.14, .28, .4, .55, .7, .36], [.18, .34, .45, .62, 1, .5], [.16, .3, .4, .58, .82, .46], [.2, .36, .42, .5, .6, .4], [.14, .26, .3, .4, .52, .3]];
    $("#heat").innerHTML = '<span></span>' + ["8 h", "11 h", "14 h", "17 h", "20 h", "23 h"].map((h) => `<span class="hd">${h}</span>`).join("") +
      days.map((d, r) => `<span>${d}</span>` + data[r].map((a) => `<i class="cell" style="--a:${a}"></i>`).join("")).join("");

    const plats = [["TikTok", "742K", 100], ["Instagram Reels", "648K", 87], ["YouTube Shorts", "492K", 66], ["YouTube largo", "372K", 50]];
    $("#plats").innerHTML = plats.map(([n, v, w]) => `<div class="plat-row"><span class="name">${n}</span><div class="progress"><span style="width:${w}%"></span></div><span class="v">${v} vistas</span></div>`).join("");
  }

  /* ---------- Configuración ---------- */
  function initConfig() {
    const cfg = store.get("config", {});
    ["estudio", "audiencia", "nicho"].forEach((k) => { if (cfg[k]) $("#cf-" + k).value = cfg[k]; });
    if (cfg.tono) $$('[data-group="tono"] [data-option]').forEach((o) => o.classList.toggle("is-selected", o.dataset.value === cfg.tono));
    if (cfg.duracion) $$('[data-group="duracion"] [data-option]').forEach((o) => o.classList.toggle("is-selected", o.dataset.value === cfg.duracion));
    if (cfg.plataformas) $$('[data-group="plataformas"] [data-option]').forEach((o) => o.classList.toggle("is-selected", cfg.plataformas.includes(o.dataset.value)));
    if (cfg.prefs) $$("[data-pref]").forEach((c) => { if (c.dataset.pref in cfg.prefs) c.checked = cfg.prefs[c.dataset.pref]; });
    if (cfg.integ) $$("[data-integ]").forEach((b) => setInteg(b, cfg.integ[b.dataset.integ]));

    function setInteg(b, on) { b.classList.toggle("on", !!on); b.textContent = on ? "Conectado" : "Conectar"; }
    $$("[data-integ]").forEach((b) => b.addEventListener("click", () => {
      // TODO(supabase): flujo OAuth real de cada integración
      setInteg(b, !b.classList.contains("on"));
    }));

    $("#btn-save-config").addEventListener("click", () => {
      const prefs = {}; $$("[data-pref]").forEach((c) => (prefs[c.dataset.pref] = c.checked));
      const integ = {}; $$("[data-integ]").forEach((b) => (integ[b.dataset.integ] = b.classList.contains("on")));
      store.set("config", {
        estudio: $("#cf-estudio").value, audiencia: $("#cf-audiencia").value, nicho: $("#cf-nicho").value,
        tono: selected("tono"), duracion: selected("duracion"),
        plataformas: $$('[data-group="plataformas"] .is-selected').map((o) => o.dataset.value), prefs, integ
      });
      // TODO(supabase): upsert en agent_settings
      toast("Cambios guardados");
    });
    $("#btn-reset-config").addEventListener("click", () => {
      try { localStorage.removeItem("flowy.config"); } catch (e) {}
      window.FlowyRender();
    });
    $("#btn-upgrade").addEventListener("click", () => toast("Planes: se conectará con la pasarela de pago"));
  }

  /* ---------- Arranque (lo llama el router en cada pantalla) ---------- */
  window.FlowyBoot = function (p) {
    page = p;
    initGroups(); initPassword(); initAuth();
    if (page.startsWith("onboarding")) initOnboarding();
    ({ index: initLanding, dashboard: initDashboard, generador: initGenerator, biblioteca: initLibrary, analiticas: initAnalytics, configuracion: initConfig }[page] || (() => {}))();
    icons();
    $$("[data-soon]").forEach((b) => { if (page !== "dashboard") b.addEventListener("click", (e) => { e.preventDefault(); toast(b.dataset.soon); }); });
  };
})();


/* ---------- Router por hash: #/login, #/dashboard?idea=... ---------- */
(function () {
  var APP = ["analiticas", "biblioteca", "configuracion", "dashboard", "generador"], TITLES = {"index": "Flowy.ai · Tu Suite Creativa con IA", "registro": "Crear cuenta · Flowy.ai", "login": "Iniciar sesión · Flowy.ai", "onboarding-1": "Bienvenida · Flowy.ai", "onboarding-2": "Tono y formato · Flowy.ai", "onboarding-3": "Activación · Flowy.ai", "dashboard": "Panel Principal · Flowy.ai", "generador": "Generador de Guiones · Flowy.ai", "biblioteca": "Biblioteca de Contenido · Flowy.ai", "analiticas": "Analíticas & Viralidad · Flowy.ai", "configuracion": "Configuración de Agente · Flowy.ai"};
  var NAV = [["dashboard","grid","Panel Principal"],["generador","sparkles","Generador de Guiones"],["biblioteca","play","Biblioteca de Contenido"],["analiticas","trend","Analíticas & Viralidad"],["configuracion","sliders","Configuración de Agente"]];
  var view = document.getElementById("view");
  function shell(page) {
    return '<header class="app-header"><a class="logo" href="#/index" aria-label="Flowy.ai">Flowy.ai</a>' +
      '<button class="studio-pill" type="button"><i data-i="folder"></i><span>Mi Estudio Creativo</span><i data-i="updown" class="i--sm"></i></button>' +
      '<a class="credit-pill" href="#/configuracion"><i data-i="zap" class="i--sm"></i><span>450 / 500 Créditos</span></a>' +
      '<button class="icon-btn" type="button" aria-label="Notificaciones"><i data-i="bell"></i></button>' +
      '<a class="avatar" href="#/configuracion" aria-label="Perfil"><i data-i="user"></i></a></header>' +
      '<aside class="app-sidebar"><div class="side-label">Plataforma</div><nav class="side-nav">' +
      NAV.map(function (n) { return '<a href="#/' + n[0] + '" class="' + (n[0] === page ? "is-active" : "") + '"><i data-i="' + n[1] + '"></i>' + n[2] + '</a>'; }).join("") +
      '</nav><div class="plan-box"><div class="head"><span>Plan Creator Pro</span><span>Activo</span></div>Renovación automática el 1 de cada mes.</div></aside>';
  }
  function parse() {
    var h = location.hash; if (h.indexOf("#/") !== 0) return null;
    var p = h.slice(2).split("?"); return { name: p[0] || "index", q: p.slice(1).join("?") };
  }
  function render() {
    var r = parse() || { name: "index", q: "" };
    var tpl = document.getElementById("tpl-" + r.name); if (!tpl) { r.name = "index"; tpl = document.getElementById("tpl-index"); }
    window.__flowyQuery = r.q;
    document.body.dataset.page = r.name; document.title = TITLES[r.name] || "Flowy.ai";
    view.innerHTML = (APP.indexOf(r.name) > -1 ? shell(r.name) : "") + tpl.innerHTML;
    window.scrollTo(0, 0);
    FlowyIcons.render(view); Flowy3D.mountAll(view); FlowyBoot(r.name);
  }
  window.FlowyRender = render;
  addEventListener("hashchange", function () { if (location.hash.indexOf("#/") === 0) render(); });
  render();
})();

</script>
